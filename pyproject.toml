[build-system]
requires = [
    "hatchling",
    "hatch-js",
]
build-backend = "hatchling.build"

[project]
name = "spaday-studio"
authors = [
    {name = "1kbgz", email = "dev@1kbgz.com"},
]
description = "AI-native visual development environment for spaday"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "mcp>=2,<3",
    "pydantic>=2",
    "spaday>=0.7,<0.8",
    "starlette",
    "transports>=0.8,<0.9",
]

[project.entry-points."spaday.component_packages"]
studio = "spaday_studio:package"

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatch-js",
    "hatchling",
    "httpx",
    "mdformat",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "uvicorn",
    "websockets",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]
spaday-studio = "spaday_studio.server:main"

[project.urls]
Repository = "https://github.com/1kbgz/spaday-studio"
Homepage = "https://github.com/1kbgz/spaday-studio"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"
pre_commit_hooks = [
    "pnpm --dir js install --lockfile-only --no-frozen-lockfile --ignore-scripts",
    "git add js/pnpm-lock.yaml",
]

[[tool.bumpversion.files]]
filename = "spaday_studio/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "js/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "spaday_studio/example.py",
    "spaday_studio/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = [
    "spaday_studio/extension",
]

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "spaday_studio",
    "js",
]
exclude = [
    "js/dist",
    "js/node_modules",
]

[tool.hatch.build.targets.wheel]
packages = [
    "spaday_studio",
]
exclude = [
    "js",
]

[tool.hatch.build.hooks.hatch-js]
path = "js"
build_cmd = "build"
tool = "pnpm"
targets = [
    "spaday_studio/extension/cdn/index.js",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "spaday_studio/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "spaday_studio",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "spaday-studio"
root = "README.md"
pages = [
    "docs/src/tutorial.md",
    "docs/src/how-to.md",
    "docs/src/save-and-export.md",
    "docs/src/use-component-package.md",
    "docs/src/reference.md",
    "docs/src/explanation.md",
]
use-autoapi = false
